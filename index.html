    <!--
      الخطوط: كانت بتتحمّل بـ <link rel="stylesheet"> عادي، وده بيوقف رسم الصفحة لحد ما
      الطلب يرجع (ده اللي كان مسبب الـ render-blocking وتأخير ظهور الـ H1 في الـ Hero).
      دلوقتي بتتحمّل بطريقة الـ "preload + onload" القياسية: التحميل بيبدأ فوراً وبنفس
      الأولوية، لكن المتصفح مابيستناش الـ CSS يخلّص قبل ما يرسم أول حاجة — وفيه fallback
      جوه <noscript> لو الـ JS متقفل. وكمان دمجت طلب Inter اللي كان مكرر في index.css
      مع Instrument Serif في طلب واحد بدل اتنين.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://db.onlinewebfonts.com" />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <link
      rel="preload"
      as="style"
      href="https://db.onlinewebfonts.com/c/d08bafd725a4cfc309efb5a88e0b63a5?family=basis33"
    />
    <link
      rel="stylesheet"
      href="https://db.onlinewebfonts.com/c/d08bafd725a4cfc309efb5a88e0b63a5?family=basis33"
      media="print"
      onload="this.media='all'"
    />

    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://db.onlinewebfonts.com/c/d08bafd725a4cfc309efb5a88e0b63a5?family=basis33"
      />
    </noscript>

    <!--
      سكريبت spline-viewer اتشال من هنا. كان بينزل على كل الأجهزة (موبايل، تابلت، ديسكتوب)

      من جوه About.tsx، وبس على الشاشات اللي فعلاً هتعرض المشهد الـ 3D.
    -->
